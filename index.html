<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="app.css">
  <title>Frontend Mentor | Product preview card component</title>
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; margin-top: 20px;}
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

<div class="container">
  <div class="containers-child">
    <div class="content">
      <picture>
        <source media="(max-width: 600px)" srcset="images/image-product-mobile.jpg">
        <img src="images/image-product-desktop.jpg" alt="Gabrielle Chanel Perfume bottle">
      </picture>
      
      <div class="main-content">
        <p class="category">Perfume</p>
        <h1>Gabrielle Essence Eau De Parfum</h1>
        <p>A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.</p> 
        
        <div class="prices-wrapper">
          <p class="first-price">$149.99</p>
          <p class="second-price">$169.99</p>
        </div>

        <button>
          <img src="images/icon-cart.svg" alt="cart icon"> Add to Cart
        </button>
      </div>
    </div>
  </div>
</div>
  
<footer class="attribution">
  Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
  Coded by <a href="#">Paata</a>.
</footer>

</body>
</html>
